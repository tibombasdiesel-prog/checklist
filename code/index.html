<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"/>
    
    <!-- Performance hints -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    
    <!-- Permissions Policy for Camera/Microphone -->
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self)"/>
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Bombas Diesel"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Bombas Diesel"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#2563eb"/>
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Checklist Bombas Diesel"/>
    <meta property="og:description" content="Sistema profissional de checklist de veículos com captura de fotos e assinaturas digitais"/>
    <meta property="og:image" content="/assets/logo-bombas-diesel-light.png" type="image/png"/>
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Checklist Bombas Diesel"/>
    <meta property="twitter:card" content="summary_large_image"/>
    <meta property="twitter:title" content="Checklist Bombas Diesel"/>
    <meta property="twitter:description" content="Sistema profissional de checklist de veículos com captura de fotos e assinaturas digitais"/>
    <meta property="twitter:image" content="/assets/logo-bombas-diesel-light.png" type="image/png"/>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json"/>
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/logo-bombas-diesel-light.png"/>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/logo-bombas-diesel-light.png"/>
    <link rel="shortcut icon" href="/assets/logo-bombas-diesel-light.png" type="image/png"/>
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/assets/logo-bombas-diesel-light.png"/>
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/logo-bombas-diesel-light.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/logo-bombas-diesel-light.png"/>
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/logo-bombas-diesel-light.png"/>
    
    <!-- Apple Splash Screens -->
    <link rel="apple-touch-startup-image" href="/assets/logo-bombas-diesel-light.png"/>
    
    <title>Checklist Bombas Diesel</title>
    
    <!-- Inline critical CSS for faster first paint -->
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
      .loading-screen { 
        min-height: 100vh; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
      }
      .loading-spinner {
        width: 48px; height: 48px;
        border: 4px solid #2563eb;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen"><div class="loading-spinner"></div></div>
    </div>
    <script type="module" src="/src/react-app/main.tsx">
    </script>
    <script>
      // Register service worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('Service Worker registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
